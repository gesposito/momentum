[install]
# the classic node_modules layout: the Jest configurations exempt the ESM-only Temporal packages
# from transformIgnorePatterns by their path under node_modules/
linker = "hoisted"

[test]
preload = ["./packages/luxon/test/setupTests.js"]
# Day.js's own test suite, vendored in packages/dayjs, runs through packages/migrate/scripts/test-dayjs-suite.ts
pathIgnorePatterns = ["packages/dayjs/**"]
